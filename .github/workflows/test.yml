name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Verify JARs are real binaries (not LFS stubs)
      shell: pwsh
      run: |
        $jars = @(
          "nmr_predicator_nmrshiftdb2\lib\predictorh.jar",
          "nmr_predicator_nmrshiftdb2\lib\predictorc.jar",
          "nmr_predicator_nmrshiftdb2\lib\cdk-2.11.jar"
        )
        foreach ($jar in $jars) {
          $size = (Get-Item $jar).Length
          Write-Host "$jar : $size bytes"
          if ($size -lt 1000) {
            Write-Error "ERROR: $jar looks like a Git LFS pointer stub ($size bytes). Run 'git lfs pull'."
            exit 1
          }
        }

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest rdkit

    - name: Clone main app (real-context integration tests)
      run: git clone --depth 1 https://github.com/HiroYokoyama/python_molecular_editor.git ../python_molecular_editor || true

    - name: Run test suite
      env:
        CI_MAIN_APP_SRC: ../python_molecular_editor/moleditpy/src
      run: |
        python -m pytest tests/ -v
